<div class="bg-animation"></div>
<section class="experience-section">
  <div class="experience-container">
    <h2 class="section-title"><i class="fas fa-tree me-2"></i> Professional Journey</h2>
    <div class="tree-container">
      <div class="tree-branch" *ngFor="let experience of experiences; let i = index" [@branchGrow]="experience.state">
        <div class="experience-node">
          <div class="node-connector" [ngClass]="{'first': i === 0, 'last': i === experiences.length - 1}"></div>
          <div class="experience-card">
            <div class="card-content">
              <div class="card-image-container text-center">
                <img [src]="experience.image" [alt]="experience.company" class="card-image">
              </div>
              <div class="card-info">
                <h3 class="card-title">{{ experience.position }}</h3>
                <p class="card-subtitle">{{ experience.company }} | {{ experience.dates }}</p>
                <ul class="card-description">
                  <li *ngFor="let point of experience.description" class="description-item">
                    <i class="fas fa-leaf me-2"></i> {{ point }}
                  </li>
                </ul>
                <div class="card-tech">
                  <p-chip *ngFor="let tag of experience.tags" [label]="tag" styleClass="tech-chip" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
