<div class="bg-animation"></div>
<div class="contact-card">
  <form #form="ngForm" (ngSubmit)="onSubmit(form)">
    <h2>Contact Me</h2>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" [(ngModel)]="name" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" [(ngModel)]="email" required email>
    </div>
    
    <div class="form-group">
      <label for="address">Address</label>
      <input id="address" name="address" [(ngModel)]="address" required>
    </div>
    <div class="form-group">
      <label for="driversLicense">Drivers License</label>
      <input id="driversLicense" name="driversLicense" [(ngModel)]="driversLicense" required>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" [(ngModel)]="message" required></textarea>
    </div>

    <button type="submit" [disabled]="form.invalid">Send Message</button>
  </form>
</div>
